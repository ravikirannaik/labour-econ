site_name: "Labour Economics — ECON207"
site_description: "Course companion site for ECON207 Labour Economics at FLAME University"
site_author: "Ravikiran Naik"
site_url: "https://ravikirannaik.github.io/labour-econ/"

theme:
  name: material
  language: en
  font:
    text: PT Sans
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.integrate
  icon:
    logo: material/briefcase-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true

extra_css:
  - css/extra.css

extra_javascript:
  - js/extra.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ravikirannaik
    - icon: fontawesome/solid/globe
      link: https://ravikirannaik.github.io/

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - How to Use: how-to-use.md
  - Chapters:
      - Overview: chapters/index.md
      - "2. Labor Supply": chapters/02-labor-supply/index.md
      - "5. Compensating Differentials": chapters/05-compensating-differentials/index.md
      - "6. Education": chapters/06-education/index.md
      - "9. Discrimination": chapters/09-discrimination/index.md
      - "12. Unemployment": chapters/11-unemployment/index.md
  - Exam Format: exam-format.md
  - Indian Context:
      - Overview: indian-context/index.md
      - "PLFS Data Guide": indian-context/plfs-overview.md
      - "Informal Economy": indian-context/informal-economy.md
      - "Gender & LFPR": indian-context/gender-lfpr.md
      - "Caste & Discrimination": indian-context/caste-discrimination.md
      - "NREGA": indian-context/nrega.md
      - "Migration": indian-context/migration.md
  - Stata: stata/index.md
  - Glossary: glossary.md
  - References: references.md
  - Acknowledgements: acknowledgements.md
  - License: license.md
